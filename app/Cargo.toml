[package]
name = "sigmadesk"
version = "0.1.0"
edition = "2021"
description = "Parsec-style remote desktop launcher on the RustDesk engine, with a self-hosted node registry"
default-run = "sigmadesk"

[features]
# The desktop app needs the window, HTTP client and PNG pieces; the server (and its Docker image,
# built with --no-default-features) doesn't.
default = ["gui"]
gui = ["dep:eframe", "dep:ureq", "dep:image"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "sigmadesk"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "sigmadesk-server"
path = "src/bin/sigmadesk-server.rs"

[dependencies]
eframe = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"], optional = true }
tiny_http = "0.12"
rand = "0.8"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[profile.release]
opt-level = 2
